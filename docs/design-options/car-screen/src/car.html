<!doctype html><html><head><meta charset="utf-8"><title>Car screen layout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1680px;background:#0b0d12;font-family:system-ui,"Liberation Sans","DejaVu Sans",sans-serif;color:#eef1f7;padding:30px 40px 36px}
h1{font-size:28px;font-weight:800}
.lines{margin:10px 0 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.lines div{background:#141824;border:1px solid #232a3b;border-radius:14px;padding:12px 16px;font-size:14.5px;line-height:1.45;color:#c4cbdc}
.lines b{color:#6ee7a8;display:block;font-size:12px;letter-spacing:.08em;margin-bottom:3px}
.row{display:flex;gap:24px;margin-bottom:8px}
.cell{position:relative;width:512px}
.frame{position:relative;width:512px;height:288px;border-radius:14px;overflow:hidden;border:1px solid #2a3144}
.cap{font-size:14px;margin:8px 2px 14px;color:#9aa3b8;display:flex;gap:8px;align-items:center}
.cap b{background:#6ee7a8;color:#06251a;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.cap span{color:#e3e8f5;font-weight:700}
/* the 1280x720 car screen */
.screen{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0e121b}
.screen svg.map{position:absolute;left:0;top:0}
.unused{position:absolute;left:1200px;top:0;width:80px;height:720px;background:repeating-linear-gradient(45deg,#06070a,#06070a 10px,#0b0d12 10px,#0b0d12 20px);border-left:2px solid #2a3144}
.unused i{position:absolute;left:0;right:0;top:300px;text-align:center;font:600 15px system-ui;color:#4b536a;font-style:normal;writing-mode:vertical-rl;transform:rotate(180deg);height:140px}
.glass{position:absolute;background:rgba(12,15,22,.86);border:2px solid rgba(255,255,255,.14);border-radius:28px;box-shadow:0 12px 34px rgba(0,0,0,.5);overflow:hidden}
.rail{position:absolute;background:rgba(9,11,17,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.bar{position:absolute;background:rgba(9,11,17,.92);display:flex;align-items:center}
.btn{width:68px;height:68px;border-radius:50%;background:#1a2030;border:2px solid #2d364a;display:grid;place-items:center;color:#dfe5f3;position:relative;flex:none}
.btn svg{width:36px;height:36px}
.btn.on{background:#173a2a;border-color:#6ee7a8;color:#6ee7a8}
.ico{display:block}
.turn{display:flex;align-items:center;gap:16px;height:100%;padding:0 22px}
.turn .big{width:84px;height:84px;border-radius:22px;background:#6ee7a8;color:#06251a;display:grid;place-items:center;flex:none}
.turn .big svg{width:60px;height:60px}
.turn .d{font-size:50px;font-weight:800;line-height:1}
.turn .s{font-size:27px;color:#aab3c8;margin-top:6px;white-space:nowrap}
.eta{display:flex;align-items:center;gap:20px;height:100%;padding:0 26px;font-size:40px;font-weight:800}
.eta small{font-size:26px;font-weight:600;color:#aab3c8}
.media{display:flex;align-items:center;gap:20px;height:100%;padding:0 22px}
.art{width:92px;height:92px;border-radius:20px;background:linear-gradient(135deg,#4cc9f0,#8f5bff 60%,#ff5a8a);flex:none;display:grid;place-items:center;color:#fff}
.art svg{width:44px;height:44px}
.media .t{font-size:32px;font-weight:800;white-space:nowrap}.media .a{font-size:25px;color:#aab3c8;margin-top:4px}
.prog{height:8px;border-radius:4px;background:#2b3144;margin-top:12px;position:relative}.prog i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:4px;background:#6ee7a8}
.ctrl{display:flex;gap:18px;align-items:center}
.ctrl .btn{width:76px;height:76px}.ctrl .btn.play{width:92px;height:92px;background:#6ee7a8;color:#06251a;border-color:#6ee7a8}.ctrl .btn.play svg{width:44px;height:44px}
.xl{display:flex;flex-direction:column;gap:22px;height:100%;padding:28px}
.xl .artbig{width:100%;flex:1;border-radius:26px;background:linear-gradient(135deg,#4cc9f0,#8f5bff 60%,#ff5a8a);display:grid;place-items:center;color:#fff;min-height:120px}
.xl .artbig svg{width:110px;height:110px}
.xl .t{font-size:42px;font-weight:800}.xl .a{font-size:30px;color:#aab3c8;margin-top:4px}
.stat{display:flex;align-items:center;gap:18px;height:100%;padding:0 22px;font-size:34px;font-weight:800;white-space:nowrap}
.stat svg{width:34px;height:34px}.stat .bt{color:#6ee7a8;display:flex;align-items:center;gap:8px}
.focus{outline:7px solid #6ee7a8;outline-offset:5px;box-shadow:0 0 0 5px #06080d,0 0 0 21px rgba(6,8,13,.6),0 12px 34px rgba(0,0,0,.5)}
.btn.focus{box-shadow:0 0 0 5px #06080d,0 0 0 21px rgba(6,8,13,.6)}
.glass *{text-shadow:0 1px 3px rgba(0,0,0,.65)}
.pb{position:absolute;border:2px solid rgba(255,255,255,.24);display:grid;place-items:center;color:#e8edf8;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.pb svg{width:36px;height:36px}.pb.on{color:#6ee7a8;border-color:#6ee7a8}
.free{position:absolute;border:4px dashed #6ee7a8;background:rgba(110,231,168,.07);border-radius:10px}
.free span{position:absolute;right:12px;bottom:8px;font:700 24px system-ui;color:#6ee7a8;background:rgba(9,11,17,.8);padding:3px 12px;border-radius:12px}
.cross{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid #fff;background:rgba(110,231,168,.35)}
.cross::before,.cross::after{content:"";position:absolute;background:#fff}
.cross::before{left:50%;top:-18px;bottom:-18px;width:3px;margin-left:-1.5px}.cross::after{top:50%;left:-18px;right:-18px;height:3px;margin-top:-1.5px}
.stopn{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;color:#0e121b;font:800 26px system-ui;display:grid;place-items:center;box-shadow:0 4px 14px #000a;z-index:5}
.infobox{position:absolute;border:4px dashed #7c86a3;border-radius:28px;z-index:5;background:rgba(124,134,163,.10)}
.info{position:absolute;font:700 20px system-ui;color:#c4cbdc;background:rgba(9,11,17,.85);border:1.5px dashed #5a6480;border-radius:12px;padding:3px 12px;z-index:5}
.ghost{position:absolute;border:5px dashed #8f9bd0;border-radius:26px;background:rgba(143,155,208,.10);z-index:4}
.sel{outline:6px solid #ffc24a;outline-offset:4px}
.handle{position:absolute;width:34px;height:34px;margin:-17px;border-radius:50%;background:#ffc24a;border:4px solid #0e121b;z-index:6}
.hand{position:absolute;z-index:7;color:#fff;filter:drop-shadow(0 4px 8px #000a)}.hand svg{width:96px;height:96px}
/* phone */
.phone{width:330px;height:530px;border-radius:34px;background:#10131b;border:1px solid #262b39;padding:16px;position:relative;overflow:hidden}
.phone .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.phone .top b{flex:1;font-size:17px}
.circ{width:30px;height:30px;border-radius:50%;background:#1b2030;display:grid;place-items:center;color:#aab3c8}.circ svg{width:18px;height:18px}
.mini{position:relative;width:298px;height:168px;border-radius:14px;overflow:hidden;border:1px solid #2f3650}
.sec{font-size:10.5px;letter-spacing:.08em;color:#8b93a7;margin:12px 2px 6px;text-transform:uppercase}
.chips{display:flex;gap:8px}
.chip{flex:1;height:50px;border-radius:15px;background:#171b27;border:1.5px solid #262b39;display:grid;place-items:center;color:#6b7390;position:relative}
.chip svg{width:24px;height:24px}.chip.on{background:#14291f;border-color:#6ee7a8;color:#6ee7a8}
.chip i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#2b3144}.chip.on i{background:#6ee7a8}
.sizes{display:flex;gap:8px;align-items:flex-end;background:#171b27;border:1.5px solid #262b39;border-radius:15px;padding:9px 14px;justify-content:space-around}
.sizes div{border-radius:6px;border:2px solid #6b7390}.sizes .s{width:30px;height:20px}.sizes .m{width:42px;height:28px;border-color:#6ee7a8;background:#14291f}.sizes .l{width:56px;height:38px}
.places{display:flex;gap:8px}.pl{flex:1;height:56px;border-radius:12px;background:#171b27;border:1.5px solid #262b39;position:relative}
.pl.on{border-color:#6ee7a8;background:#14291f}.pl i{position:absolute;border-radius:3px;background:#6b7390}.pl.on i{background:#6ee7a8}
.legend{display:flex;gap:18px;font-size:13px;color:#9aa3b8;margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.col2{display:flex;flex-direction:column}
.sheet{width:1600px;background:#10131b;border:1px solid #232a3b;border-radius:18px;overflow:hidden}
.or{display:grid;grid-template-columns:300px repeat(6,1fr);border-bottom:1px solid #232a3b;align-items:center;min-height:84px}
.or.head{padding:16px 0 14px;align-items:start;border-bottom:2px solid #2d364a}
.th{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.th .nm{font-size:14px;font-weight:800;color:#e3e8f5}
.lb{display:flex;gap:12px;padding:0 20px;align-items:center}.lb b{width:30px;height:30px;border-radius:50%;background:#6ee7a8;color:#06251a;display:grid;place-items:center;font-size:15px;flex:none}
.lb span{font-size:16px;font-weight:800;display:block}.lb small{font-size:12px;color:#8b93a7;display:block;margin-top:2px}
.vc{display:flex;justify-content:center;padding:10px 4px}.vc small{font-size:12.5px;color:#c4cbdc;text-align:center}
</style></head><body>
<!--SPRITE-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<symbol id="turn" viewBox="0 0 24 24"><path d="M6 21V11a4 4 0 0 1 4-4h8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m15 3 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.6" fill="currentColor"/><circle cx="17" cy="16" r="2.6" fill="currentColor"/></symbol>
<symbol id="nav" viewBox="0 0 24 24"><path d="M12 3 19 20l-7-4-7 4z" fill="currentColor"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M6.5 4h3l1.5 4-2 1.3a11 11 0 0 0 5.7 5.7L16 13l4 1.5v3A2.5 2.5 0 0 1 17.5 20 13.5 13.5 0 0 1 4 6.5 2.5 2.5 0 0 1 6.5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
<symbol id="prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5v14L9 12z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="M18 5v14M5 5v14l10-7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="tapx" viewBox="0 0 24 24"><path d="M9 11V5.5a1.6 1.6 0 0 1 3.2 0V11l4.3.9a2.2 2.2 0 0 1 1.7 2.6l-.7 4A3 3 0 0 1 14.6 21h-3.1a3 3 0 0 1-2.4-1.2L6 15.5a1.5 1.5 0 0 1 2.4-1.8L9 14.4" fill="rgba(255,255,255,.15)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
</svg>
<h1 id="title"></h1>
<div class="lines" id="lines"></div>
<div class="row" id="row1"></div>
<div class="row" id="row2"></div>
<script>/*LIB*/</script>
<script>const LAYOUT='__LAYOUT__'; build(LAYOUT);</script>
</body></html>
