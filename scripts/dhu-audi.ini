; Desktop Head Unit profile matching the owner's car as Android Auto sees it:
; a 1280x720 picture at 213 dpi, no touch, driven by a rotary knob.
;
; On the car Android Auto draws into 1200x723 of that picture (rail 107 px on the left, main
; area 1093 px) and leaves about 80 px unused on the right. marginwidth reproduces that
; narrower drawing area; DHU centres it, where the car leaves the whole gap on the right.
; If the layout does not come out 1200 wide, remove the marginwidth line and compare.
;
; Use:  .\dhu-watch.ps1 -Config .\dhu-audi.ini
[general]
touch = false
touchpad = false
controller = true
instrumentcluster = false
resolution = 1280x720
dpi = 213
marginwidth = 80
marginheight = 0
framerate = 30
